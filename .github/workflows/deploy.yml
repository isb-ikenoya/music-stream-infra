name: Terraform Deploy

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/**" # ワークフロー自体
  pull_request:
    branches: [develop]
    paths:
      - "backend/**" # Lambdaのソースコード
      - "infra/**" # Terraformコード
      - ".github/workflows/**" # ワークフロー自体

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read # コードの読み取り
      pull-requests: write # PRへのコメント書き込み権限
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # TFCのUser Settings > Tokensで発行したトークンをGitHubのSecretに登録
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ./infra/environments/dev

        # PR作成時に Plan を実行して結果をコメントする
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        id: plan
        run: terraform plan -no-color -input=false
        working-directory: ./infra/environments/dev
        continue-on-error: true

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`

            <details><summary>詳細なログを表示</summary>

            \`\`\`${process.env.PLAN}\`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: terraform apply -auto-approve -input=false
        working-directory: ./infra/environments/dev
